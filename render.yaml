services:
  - type: web
    # Render regions are immutable; create a new free Singapore service.
    name: morph-gateway-sg
    branch: main
    env: docker
    dockerContext: .
    dockerfilePath: ./Docker/Dockerfile
    plan: free
    region: singapore
    autoDeploy: false
    healthCheckPath: /readyz
    envVars:
      - key: OMNI_ENV
        value: production
      - key: OMNI_API_TOKEN
        generateValue: true
      - key: REGISTRY_PATH
        value: /tmp/registry_store.json
      - key: OMNI_DEV_EVENTS
        value: "0"
