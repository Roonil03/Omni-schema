services:
  - type: web
    # Regions cannot be changed on an existing service. Create this free
    # Singapore service alongside the original, then migrate clients.
    name: morph-gateway-sg
    branch: codex/cbor
    env: docker
    dockerContext: .
    dockerfilePath: ./Docker/Dockerfile
    plan: free
    region: singapore
    autoDeploy: false
    healthCheckPath: /readyz
    envVars:
      - key: OMNI_ENV
        value: production
      - key: OMNI_API_TOKEN
        generateValue: true
      - key: REGISTRY_PATH
        value: /tmp/registry_store.json
      - key: OMNI_DEV_EVENTS
        value: "0"
