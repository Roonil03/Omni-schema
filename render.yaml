services:
  - type: web
    name: morph-gateway
    env: docker
    dockerContext: .
    dockerfilePath: ./Docker/Dockerfile
    plan: 0.5c-512mb
    autoDeploy: false
    healthCheckPath: /readyz
    envVars:
      - key: OMNI_ENV
        value: production
      - key: OMNI_API_TOKEN
        generateValue: true
      - key: REGISTRY_PATH
        value: /var/data/registry_store.json
      - key: OMNI_DEV_EVENTS
        value: "0"
    disk:
      name: registry-data
      mountPath: /var/data
      sizeGB: 1
